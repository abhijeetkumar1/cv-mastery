[project]
name = "cv-mastery"
version = "0.1.0"
description = "Hands-on computer vision learning path"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "matplotlib",
    "opencv-contrib-python",
    "pillow",
    "scikit-image",
    "torch",
    "torchvision",
    "tqdm",
    "timm",
    "pyarrow",
    "pandas",
    "ultralytics",
    "pycocotools",
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
    "transformers>=5.22.1",
    "scipy>=1.18.1",
]

[tool.uv]
package = false
# ultralytics depends on opencv-python, which would clash with opencv-contrib-python (both provide cv2).
# The contrib build is a superset, so never install the plain one.
override-dependencies = ["opencv-python; sys_platform == 'never'", "opencv-python-headless; sys_platform == 'never'"]
